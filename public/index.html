<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telos</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%231f5c8a' stroke-width='7'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%231f5c8a'/%3E%3C/svg%3E"
    />
    <script>
      // Apply a saved theme choice before the stylesheet paints, so the page
      // never flashes the wrong theme. Guarded because storage can throw.
      (function () {
        try {
          var t = localStorage.getItem("telos-theme");
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="/dom.js"></script>
    <script src="/student.js"></script>
    <script src="/admin.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
